[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra_image_store_adt4"
version = "0.1.0"
description = "ADT4 tools on top of hydra_image_store: SAM3 write-back, legacy import, fuse, store conversion"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = ["hydra_image_store", "numpy"]
authors = [{name = "harelb", email = "harelb@mit.edu"}]

[project.optional-dependencies]
test = ["pytest", "Pillow"]

[project.scripts]
hydra-image-store-adt4 = "hydra_image_store_adt4.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
